[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytevox-harness"
version = "0.1.0"
description = "A bounded, inspectable multi-agent evidence harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bytevox-harness = "bytevox_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bytevox_harness = ["fixtures/corpus/*.md", "fixtures/injection_corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
